{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Admin{% endblock %} &mdash; Alpha Health Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="admin-body">
    <aside class="admin-sidebar">
        <div class="admin-sidebar__logo">Admin</div>
        <nav>
            <a href="{% url 'dashboard:home' %}">Dashboard</a>
            <a href="#">Organizations</a>
            <a href="#">Projects</a>
            <a href="#">Services</a>
            <a href="#">Team</a>
            <a href="#">Products</a>
            <a href="#">Inquiries</a>
        </nav>
        <form method="post" action="{% url 'dashboard:logout' %}" class="admin-sidebar__logout">
            {% csrf_token %}
            <button type="submit">Log Out</button>
        </form>
    </aside>
    <main class="admin-main">
        {% block admin_content %}{% endblock %}
    </main>
</body>
</html>
