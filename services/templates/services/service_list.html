{% extends 'base.html' %}
{% block title %}Services{% endblock %}
{% block content %}
    <h1>Services</h1>
    <ul>
        {% for service in services %}
            <li>
                <a href="{% url 'service_detail' service.slug %}">{{ service.name }}</a>
                <p>{{ service.short_description }}</p>
            </li>
        {% empty %}
            <li>No services listed yet.</li>
        {% endfor %}
    </ul>
{% endblock %}
