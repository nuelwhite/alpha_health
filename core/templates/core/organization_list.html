{% extends 'base.html' %}

{% block title %}Organizations{% endblock %}

{% block content %}
    <h1>Our Organizations</h1>
    <ul>
        {% for org in organizations %}
            <li>
                <strong>{{ org.name }}</strong> ({{ org.country }})
                <p>{{ org.short_description }}</p>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
