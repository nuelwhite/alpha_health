{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AO Health Group</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="ao-landing">
    <header class="ao-header">
        {% if ao.logo %}
            <img src="{{ ao.logo.url }}" alt="AO Health Group" class="ao-header__logo">
        {% else %}
            <span class="ao-header__title">AO Health Group</span>
        {% endif %}
        <a href="{% url 'home' %}" class="ao-header__back">&larr; The Alpha Health Group</a>
    </header>

    <section class="ao-hero">
        <div class="ao-hero__content">
            <h1>Primary Focus</h1>
            <div class="rich-content">
                {% if ao %}{{ ao.short_description|default:ao.description|safe }}{% endif %}
            </div>
            <a href="{% url 'product_list' %}" class="btn btn--primary">Product Catalogue</a>
        </div>
    </section>

    <footer class="site-footer">
        <p>&copy; {% now "Y" %} AO Health Group, a program of The Alpha Health Group.</p>
    </footer>
</body>
</html>
